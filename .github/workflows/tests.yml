name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12","3.13","3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install nbformat
      - name: Validate notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          # The curated notebook set lives in these three subdirectories (see
          # CLAUDE.md); notebooks/Tests/ and notebooks/genfit/ are scratch/
          # informal work not covered by this check.
          paths = [
              path
              for directory in ("tutorials", "data_analyses", "benchmark")
              for path in sorted((Path("notebooks") / directory).glob("*.ipynb"))
          ]
          for path in paths:
              with path.open(encoding="utf-8") as handle:
                  notebook = nbformat.read(handle, as_version=4)
              nbformat.validate(notebook)
              for index, cell in enumerate(notebook.cells):
                  if cell.cell_type == "code":
                      compile(cell.source, f"{path}:cell-{index}", "exec")
              print(f"validated {path}")
          PY
      - name: Test suite
        run: pytest tests
