name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12","3.13","3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: bash
        run: |
          # PyPI's per-package "simple" index occasionally returns transient
          # 503s (observed for mplhep independently of Python version); retry
          # each install with backoff instead of failing the whole matrix job.
          install_with_retries() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if python -m pip install --retries 10 --timeout 60 "$@"; then
                return 0
              fi
              echo "pip install failed (attempt $attempt/5) for: $*" >&2
              sleep $((attempt * 15))
            done
            return 1
          }
          python -m pip install --upgrade pip
          install_with_retries -e ".[test,sympy]"
          install_with_retries nbformat
      - name: Validate notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          # The curated notebook set lives in these three subdirectories (see
          # CLAUDE.md); notebooks/Tests/ and notebooks/genfit/ are scratch/
          # informal work not covered by this check.
          paths = [
              path
              for directory in ("tutorials", "_data_analyses", "benchmark")
              for path in sorted((Path("notebooks") / directory).glob("*.ipynb"))
          ]
          for path in paths:
              with path.open(encoding="utf-8") as handle:
                  notebook = nbformat.read(handle, as_version=4)
              nbformat.validate(notebook)
              for index, cell in enumerate(notebook.cells):
                  if cell.cell_type == "code":
                      compile(cell.source, f"{path}:cell-{index}", "exec")
              print(f"validated {path}")
          PY
      - name: Test suite
        run: pytest tests
