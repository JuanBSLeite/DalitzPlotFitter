name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install nbformat
      - name: Validate notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          for path in sorted(Path("notebooks").glob("*.ipynb")):
              with path.open(encoding="utf-8") as handle:
                  notebook = nbformat.read(handle, as_version=4)
              nbformat.validate(notebook)
              for index, cell in enumerate(notebook.cells):
                  if cell.cell_type == "code":
                      compile(cell.source, f"{path}:cell-{index}", "exec")
              print(f"validated {path}")
          PY
      - name: Fundamental tests
        run: |
          pytest \
            tests/test_adaptive_dalitz.py \
            tests/test_adaptive_square.py \
            tests/test_amplitude_cache.py \
            tests/test_babar_flatte.py \
            tests/test_coefficients.py \
            tests/test_coherent_amplitude.py \
            tests/test_constraints.py \
            tests/test_covariant_kinematics.py \
            tests/test_cp_likelihood.py \
            tests/test_cp_multi_background.py \
            tests/test_dalitz_grid.py \
            tests/test_decay_model.py \
            tests/test_discriminants.py \
            tests/test_dynamics.py \
            tests/test_integration.py \
            tests/test_minimizer.py \
            tests/test_multi_background.py \
            tests/test_phasespace_mc.py \
            tests/test_resonance_amplitude.py \
            tests/test_sampling.py \
            tests/test_scf.py \
            tests/test_square_dalitz.py \
            tests/test_veto.py
