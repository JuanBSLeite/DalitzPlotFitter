name: toy generation benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        size: [10000, 100000, 1000000]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Benchmark ${{ matrix.size }} events
        env:
          JAX_PLATFORMS: cpu
        run: |
          python benchmarks/benchmark_toy_generation.py --size ${{ matrix.size }}
